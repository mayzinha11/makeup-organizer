<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makeup Organizer</title>
</head>
<body>

 <header>
    <h1> Makeup Organizer</h1>
    <p>Sistema de gestao e controle de maquiagem e cosmeticos</p>
    <nav>
        <ul>
            <li><a href="#cadastro">Cadastrar Produtos</a></li>
            <li><a href="#filtros">Pesquisar</a></li>
            <li><a href="#colecao">Minha Colecao</a></li>
            <li><a href="#detalhes">Detalhes</a></li>
        </ul>
    </nav>
 </header>

 <main>
    <section id="cadastro">
       <h2>Cadastrar Novo Produto</h2>
       <form>
        <div>
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div>
            <label for="marca">Marca:</label>
            <input type="text" id="marca" name="marca" required>
        </div>

        <div>
            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecione</option>
                <option value="batom">Labios</option>
                <option value="base">Olhos</option>
                <option value="sombra">Pele</option>
                <option value="blush">Skincare</option>
            </select>
        </div>

        <div>
            <label for="Validade">Data de Validade:</label>
            <input type="date" id="Validade" name="Validade">
        </div>

        <div>
            <label for="status">Status de Uso:</label>
            <select id="status" name="status">
                <option value="lacrado">Lacrado</option>
                <option value="em-uso">Em uso</option>
                <option value="Finalizado">Finalizado</option>
            </select>
        </div>

        <div>
            <label for="avaliacao">Avaliação (1 a 5):</label>
            <input type="number" id="avaliacao" name="avaliacao" min="1" max="5" value="5">
        </div>

        <div>
            <button type="submit">Salvar Produto</button>
       </form>
    </section>

 </main>

 <footer>
    <p>&copy; 2026 Makeup Organizer. Trabalho pratico de Desenvolvimento Web.</p>
</footer>

</body>
</html>
